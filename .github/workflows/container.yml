name: Build and publish LoLeS image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mirivlad/loles
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build image for verification
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ghcr.io/mirivlad/loles:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate isolated test credentials
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:8088" >> "$GITHUB_ENV"
          echo "LOLES_IMAGE=ghcr.io/mirivlad/loles:ci" >> "$GITHUB_ENV"
          echo "LOLES_PULL_POLICY=never" >> "$GITHUB_ENV"

      - name: Smoke test a fresh deployment
        run: |
          set -euo pipefail
          trap 'docker compose logs --tail=100 app db; docker compose down -v' EXIT
          docker compose up -d
          healthy=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8088/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" = 1
          # A PHP warning emitted before the response corrupts redirects and session headers.
          # Check the CLI with full deprecation reporting, even though web output is disabled.
          bootstrap_output=$(docker compose exec -T app php -d display_errors=1 -d error_reporting=32767 artisan --version 2>&1)
          if grep -Eiq "Deprecated|Warning|Fatal error" <<< "$bootstrap_output"; then
            echo "$bootstrap_output"
            exit 1
          fi
          redirect_status=$(curl -sS -o /tmp/loles-dashboard -w '%{http_code}' http://127.0.0.1:8088/dashboard)
          test "$redirect_status" = "302"
          curl -fsS http://127.0.0.1:8088/ -o /tmp/loles-home.html
          if grep -Eiq 'Deprecated|<b>Warning</b>' /tmp/loles-home.html; then
            echo "PHP diagnostic leaked into public HTML"
            exit 1
          fi
          docker compose exec -T app php artisan migrate:status
          docker compose exec -T app php artisan help loles:create-admin >/dev/null
          # Render rich lesson content as the actual Apache user. Running the
          # test suite as root concealed an HTMLPurifier cache permission bug.
          rich_output=$(docker compose exec -T -u www-data app php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            echo app(\App\Services\LearningHtml::class)->clean("<p><strong>WYSIWYG works</strong></p>");
          ')
          grep -Fq '<strong>WYSIWYG works</strong>' <<< "$rich_output"
          docker compose exec -T app php artisan view:cache
          # Development dependencies and tests are intentionally absent from the production image.
          # Install them into the disposable Actions container only.
          docker compose exec -T app composer install --dev --no-interaction --no-progress --prefer-dist
          docker compose exec -T app mkdir -p /var/www/html/tests
          docker cp tests/. "$(docker compose ps -q app)":/var/www/html/tests/
          docker compose exec -T -e APP_ENV=testing app vendor/bin/phpunit
          # Simulate Portainer Pull + Redeploy and verify the file volume survives.
          docker compose exec -T app sh -c 'printf persisted > storage/app/public/persistence-test.txt'
          docker compose up -d --force-recreate app
          docker compose exec -T app test -f storage/app/public/persistence-test.txt

      # Push production tags only after installation, redirects and regression tests pass.
      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
