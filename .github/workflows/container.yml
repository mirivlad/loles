name: Build and publish LoLeS image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mirivlad/loles
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate isolated test credentials
        if: github.ref == 'refs/heads/main'
        run: |
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "APP_URL=http://127.0.0.1:8088" >> "$GITHUB_ENV"

      - name: Smoke test a fresh deployment
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          trap 'docker compose logs --tail=100 app db; docker compose down -v' EXIT
          docker compose up -d
          healthy=0
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8088/ >/dev/null; then
              healthy=1
              break
            fi
            sleep 5
          done
          test "$healthy" = 1
          docker compose exec -T app php artisan migrate:status
          docker compose exec -T app php artisan help loles:create-admin >/dev/null
          docker compose exec -T app php artisan view:cache
          docker compose exec -T app composer install --no-interaction --no-progress --prefer-dist
          docker compose exec -T app php artisan test --stop-on-failure
          # Simulate Portainer Pull + Redeploy and verify the file volume survives.
          docker compose exec -T app sh -c 'printf persisted > storage/app/public/persistence-test.txt'
          docker compose up -d --force-recreate app
          docker compose exec -T app test -f storage/app/public/persistence-test.txt
