# LoLeS — Portainer-friendly stack. Set APP_KEY and DB_PASSWORD in the
# Portainer stack environment variables or in a local .env file.
services:
  app:
    image: ${LOLES_IMAGE:-ghcr.io/mirivlad/loles:latest}
    pull_policy: ${LOLES_PULL_POLICY:-always}
    restart: unless-stopped
    ports:
      - "${LOLES_PORT:-8088}:80"
    environment:
      APP_NAME: LoLeS
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "${APP_URL:-http://localhost:8088}"
      APP_KEY: "${APP_KEY:?Set a stable Laravel APP_KEY}"
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: loles
      DB_USERNAME: loles
      DB_PASSWORD: "${DB_PASSWORD:?Set a strong database password}"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: public
      MAIL_MAILER: log
      LOLES_PUBLIC_REGISTRATION: "${LOLES_PUBLIC_REGISTRATION:-false}"
      LOLES_DEMO_DATA: "${LOLES_DEMO_DATA:-false}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: loles
      MARIADB_USER: loles
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set a strong database password}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  db_data:
  app_storage:
